image:
  repository: ghcr.io/dseif0x/agent-lifecycle-controller
  # Pin a build for reproducible deploys, e.g. "sha-1234567" or
  # "latest@sha256:<digest>".
  tag: latest
  pullPolicy: IfNotPresent

gpuNode:
  mac: ff:ff:ff:ff:ff:ff
  host: 10.10.10.10
  wake_host: 10.10.255.255
  uname: dan1
  # Run over SSH by /shutdown. "sudo systemctl suspend" suspends to RAM
  # instead (needs WoL from S3 and a sudo rule for it on the node).
  shutdownCommand: "sudo shutdown now"

extraResources: